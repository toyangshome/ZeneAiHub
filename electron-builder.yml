appId: com.zenework.zene-ai-hub
productName: ZeneAIHub
directories:
  output: release
files:
  - dist/**/*
  - resources/**/*
  - package.json
win:
  target:
    - nsis
  icon: resources/icon.png
mac:
  target:
    - dmg
  icon: resources/icon.png
linux:
  target:
    - AppImage
  icon: resources/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
